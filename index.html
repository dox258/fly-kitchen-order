<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>非晉餐廚蒸烤料理｜線上團購點餐</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8f9f6; }
  </style>
</head>
<body class="text-stone-800 pb-24">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-30 bg-[#3d5a45] text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
      <div>
        <h1 class="text-lg md:text-xl font-bold tracking-wide">非晉餐廚蒸烤料理</h1>
        <p class="text-xs text-emerald-100">少油蒸烤・健康餐盒＆義大利麵線上團購</p>
      </div>
      <div class="flex items-center gap-2">
        <a id="sheetLinkBtn" href="#" target="_blank" class="hidden bg-amber-500 hover:bg-amber-600 text-white text-xs font-medium px-3 py-2 rounded-lg transition">
          📊 查看即時統計
        </a>
        <button onclick="openSettingsModal()" class="bg-white/15 hover:bg-white/25 text-white text-xs font-medium px-3 py-2 rounded-lg transition">
          ⚙️ 設定統計
        </button>
        <button onclick="toggleEditMode()" id="editModeBtn" class="bg-white/15 hover:bg-white/25 text-white text-xs font-medium px-3 py-2 rounded-lg transition">
          ✏️ 菜單管理
        </button>
      </div>
    </div>
  </header>

  <!-- 訂購人與用餐資訊列 -->
  <section class="max-w-5xl mx-auto px-4 pt-4">
    <div class="bg-white rounded-xl p-4 shadow-sm border border-stone-200 grid grid-cols-1 md:grid-cols-3 gap-3">
      <div>
        <label class="block text-xs font-bold text-stone-600 mb-1">訂購人姓名 / 部門 <span class="text-red-500">*</span></label>
        <input type="text" id="customerName" placeholder="例如：Josh / 資訊部" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#3d5a45]" />
      </div>
      <div>
        <label class="block text-xs font-bold text-stone-600 mb-1">取餐方式</label>
        <select id="orderType" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#3d5a45]">
          <option value="團體外送">團體外送</option>
          <option value="外帶自取">外帶自取</option>
          <option value="內用">內用</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-stone-600 mb-1">搜尋餐點</label>
        <input type="text" id="searchInput" oninput="renderMenu()" placeholder="輸入關鍵字（如：雞胸、松阪豬、青醬）" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#3d5a45]" />
      </div>
    </div>
  </section>

  <!-- 分類頁籤 -->
  <nav class="max-w-5xl mx-auto px-4 py-4 flex gap-2 overflow-x-auto" id="categoryTabs"></nav>

  <!-- 菜單管理新增區（預設隱藏） -->
  <section id="adminAddSection" class="hidden max-w-5xl mx-auto px-4 mb-4">
    <div class="bg-amber-50 border border-amber-200 rounded-xl p-4">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-amber-900 text-sm">➕ 新增菜單品項（對照官方最新菜單調整）</h2>
        <button onclick="resetDefaultMenu()" class="text-xs text-red-600 underline">恢復預設菜單</button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-4 gap-2">
        <input type="text" id="newItemName" placeholder="餐點名稱" class="border rounded-lg px-3 py-1.5 text-sm bg-white" />
        <select id="newItemCategory" class="border rounded-lg px-3 py-1.5 text-sm bg-white">
          <option value="蒸烤餐盒">蒸烤餐盒</option>
          <option value="義大利麵">義大利麵</option>
          <option value="單點配菜">單點配菜</option>
          <option value="健康飲品">健康飲品</option>
        </select>
        <input type="number" id="newItemPrice" placeholder="價格 (元)" class="border rounded-lg px-3 py-1.5 text-sm bg-white" />
        <button onclick="addNewMenuItem()" class="bg-[#3d5a45] text-white rounded-lg px-4 py-1.5 text-sm font-medium hover:bg-[#2f4635]">新增品項</button>
      </div>
    </div>
  </section>

  <!-- 餐點列表 -->
  <main class="max-w-5xl mx-auto px-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="menuGrid"></main>

  <!-- 底部懸浮購物車列 -->
  <div class="fixed bottom-0 inset-x-0 bg-white border-t border-stone-200 shadow-lg z-30">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <span class="text-xs text-stone-500">已選購 <strong id="totalCount" class="text-[#3d5a45] text-base">0</strong> 份餐點</span>
        <div class="text-lg font-bold text-stone-900">總計：NT$ <span id="totalPrice">0</span></div>
      </div>
      <button onclick="openCartModal()" class="bg-[#3d5a45] hover:bg-[#2f4635] text-white font-bold px-6 py-2.5 rounded-xl shadow transition">
        查看購物車 / 送出訂單
      </button>
    </div>
  </div>

  <!-- 客製化選項 Modal -->
  <div id="customModal" class="hidden fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl">
      <div class="flex justify-between items-start border-b pb-3">
        <div>
          <h3 id="modalItemName" class="text-lg font-bold text-stone-900"></h3>
          <p id="modalItemPrice" class="text-sm text-[#3d5a45] font-bold"></p>
        </div>
        <button onclick="closeCustomModal()" class="text-stone-400 hover:text-stone-700 text-xl">&times;</button>
      </div>

      <div class="space-y-4 my-4 max-h-[60vh] overflow-y-auto pr-1">
        <div id="riceOptionGroup">
          <label class="block text-xs font-bold text-stone-700 mb-1.5">主食飯量調整</label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="border rounded-lg p-2 flex items-center gap-2 cursor-pointer"><input type="radio" name="rice" value="正常紫米飯" checked /> 正常紫米飯</label>
            <label class="border rounded-lg p-2 flex items-center gap-2 cursor-pointer"><input type="radio" name="rice" value="少飯" /> 少飯</label>
            <label class="border rounded-lg p-2 flex items-center gap-2 cursor-pointer"><input type="radio" name="rice" value="飯換綜合時蔬" /> 飯換綜合時蔬</label>
            <label class="border rounded-lg p-2 flex items-center gap-2 cursor-pointer"><input type="radio" name="rice" value="不需要飯" /> 不需要飯</label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-stone-700 mb-1.5">加購配料（可複選）</label>
          <div class="space-y-1.5 text-xs">
            <label class="border rounded-lg p-2 flex justify-between items-center cursor-pointer">
              <span><input type="checkbox" class="addon-check mr-2" data-name="溏心蛋" data-price="20" /> 招牌溏心蛋</span>
              <span class="text-stone-500">+NT$ 20</span>
            </label>
            <label class="border rounded-lg p-2 flex justify-between items-center cursor-pointer">
              <span><input type="checkbox" class="addon-check mr-2" data-name="雙倍主肉" data-price="55" /> 雙倍主肉增量</span>
              <span class="text-stone-500">+NT$ 55</span>
            </label>
            <label class="border rounded-lg p-2 flex justify-between items-center cursor-pointer">
              <span><input type="checkbox" class="addon-check mr-2" data-name="水煮花椰菜" data-price="30" /> 加量水煮花椰菜</span>
              <span class="text-stone-500">+NT$ 30</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-stone-700 mb-1">單品備註</label>
          <input type="text" id="modalNote" placeholder="例如：不要胡椒、醬分開" class="w-full border rounded-lg px-3 py-2 text-xs" />
        </div>
      </div>

      <button onclick="confirmAddToCart()" class="w-full bg-[#3d5a45] hover:bg-[#2f4635] text-white font-bold py-2.5 rounded-xl transition">
        加入購物車
      </button>
    </div>
  </div>

  <!-- 購物車與結帳 Modal -->
  <div id="cartModal" class="hidden fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-5 shadow-xl">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold">確認訂單明細</h3>
        <button onclick="closeCartModal()" class="text-stone-400 hover:text-stone-700 text-xl">&times;</button>
      </div>

      <div id="cartItemsList" class="my-4 space-y-2 max-h-[45vh] overflow-y-auto"></div>

      <div class="border-t pt-3 space-y-3">
        <div>
          <label class="block text-xs font-bold text-stone-700 mb-1">整筆訂單備註</label>
          <input type="text" id="globalOrderNote" placeholder="例如：需要餐具、12:00前送達" class="w-full border rounded-lg px-3 py-2 text-xs" />
        </div>

        <div class="flex justify-between items-center text-base font-bold">
          <span>應付總金額</span>
          <span class="text-[#3d5a45] text-xl">NT$ <span id="modalTotalPrice">0</span></span>
        </div>

        <div id="submitStatusMsg" class="hidden text-xs p-2.5 rounded-lg"></div>

        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="copyOrderText()" class="border border-[#3d5a45] text-[#3d5a45] hover:bg-emerald-50 font-bold py-2.5 rounded-xl text-sm transition">
            📋 複製 LINE 明細
          </button>
          <button id="submitOrderBtn" onclick="submitOrderToSheet()" class="bg-[#3d5a45] hover:bg-[#2f4635] text-white font-bold py-2.5 rounded-xl text-sm transition">
            🚀 送出並統計訂單
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Google Sheets 統計串接設定 Modal -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl">
      <div class="flex justify-between items-center border-b pb-3 mb-3">
        <h3 class="text-base font-bold">⚙️ 團購統計試算表設定</h3>
        <button onclick="closeSettingsModal()" class="text-stone-400 hover:text-stone-700 text-xl">&times;</button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-stone-700 mb-1">Google Apps Script 網頁應用程式網址 (必填)</label>
          <input type="url" id="gasUrlInput" placeholder="https://script.google.com/macros/s/.../exec" class="w-full border rounded-lg px-3 py-2" />
          <p class="text-stone-400 mt-1">設定後，所有人送出的訂單都會自動寫入您的試算表。</p>
        </div>
        <div>
          <label class="block font-bold text-stone-700 mb-1">Google 試算表查看網址 (選填)</label>
          <input type="url" id="sheetUrlInput" placeholder="https://docs.google.com/spreadsheets/d/..." class="w-full border rounded-lg px-3 py-2" />
          <p class="text-stone-400 mt-1">填入後，頂部會顯示「查看即時統計」按鈕方便點擊檢視。</p>
        </div>
        <button onclick="saveSettings()" class="w-full bg-[#3d5a45] text-white font-bold py-2.5 rounded-xl text-sm mt-2">
          儲存設定
        </button>
      </div>
    </div>
  </div>

  <script>
    // 如果要讓所有人打開網頁就自動綁定，也可以直接把網址貼在下面兩個引號內：
    const HARDCODED_GAS_URL = "https://script.google.com/macros/s/AKfycbzBPI4exsmjflRK_Z-jcGQY9BQbeeZwNyNXa6iLklY5T6wqVdyzYNCYg1TFbNstpdjSHg/exec"; 
    const HARDCODED_SHEET_URL = "https://docs.google.com/spreadsheets/d/1dmzGOgUlsNc03uant42RCfKSUpMQLpfkyfQMYdyH4U0/edit?gid=0#gid=0";

    const DEFAULT_MENU = [
      { id: 1, name: "舒肥嫩煎雞胸餐盒", category: "蒸烤餐盒", price: 125, desc: "低溫蒸烤鎖住肉汁，搭配季節水煮時蔬與紫米飯" },
      { id: 2, name: "義式香草蒸烤雞腿排餐盒", category: "蒸烤餐盒", price: 145, desc: "去骨大雞腿佐迷迭香與義式香料蒸烤" },
      { id: 3, name: "鹽麴蒸烤松阪豬餐盒", category: "蒸烤餐盒", price: 165, desc: "脆彈松阪豬搭配日本鹽麴提鮮，清爽不油膩" },
      { id: 4, name: "檸香蒸烤鮭魚菲力餐盒", category: "蒸烤餐盒", price: 185, desc: "挪威鮭魚搭配新鮮黃檸檬蒸烤，富含Omega-3" },
      { id: 5, name: "和風照燒蒸烤鯖魚餐盒", category: "蒸烤餐盒", price: 140, desc: "薄鹽挪威鯖魚高溫蒸烤，肉質細嫩" },
      { id: 6, name: "日式壽喜蒸烤牛五花餐盒", category: "蒸烤餐盒", price: 155, desc: "特調低鈉壽喜醬汁蒸烤牛五花" },
      { id: 7, name: "羅勒青醬嫩雞義大利麵", category: "義大利麵", price: 150, desc: "新鮮九層塔打製青醬搭配舒肥雞胸" },
      { id: 8, name: "番茄紅醬海鮮義大利麵", category: "義大利麵", price: 175, desc: "新鮮牛番茄熬煮醬汁，搭配鮮蝦與蛤蜊" },
      { id: 9, name: "蒜香清炒松阪豬義大利麵", category: "義大利麵", price: 170, desc: "橄欖油與蒜片爆香清炒，保留食材原味" },
      { id: 10, name: "奶油白醬野菇雞腿義大利麵", category: "義大利麵", price: 165, desc: "濃郁奶香搭配綜合鮮菇與蒸烤雞腿" },
      { id: 11, name: "單點蒸烤雞腿排", category: "單點配菜", price: 85, desc: "無澱粉高蛋白加菜首選" },
      { id: 12, name: "單點舒肥雞胸肉", category: "單點配菜", price: 65, desc: "原味黑胡椒舒肥雞胸" },
      { id: 13, name: "綜合蒸烤時蔬拼盤", category: "單點配菜", price: 60, desc: "花椰菜、玉米筍、地瓜、杏鮑菇" },
      { id: 14, name: "冷泡高山青茶 (無糖)", category: "健康飲品", price: 35, desc: "台灣高山茶葉低溫冷泡，回甘解膩" },
      { id: 15, name: "無糖濃豆漿", category: "健康飲品", price: 35, desc: "非基改黃豆研磨，補充植物性蛋白" }
    ];

    let menuItems = JSON.parse(localStorage.getItem('fly_kitchen_menu')) || DEFAULT_MENU;
    let currentCategory = "全部";
    let isEditMode = false;
    let cart = [];
    let selectedItem = null;

    function getGasUrl() {
      return HARDCODED_GAS_URL || localStorage.getItem('fly_gas_url') || "";
    }
    function getSheetUrl() {
      return HARDCODED_SHEET_URL || localStorage.getItem('fly_sheet_url') || "";
    }

    function init() {
      const sheetUrl = getSheetUrl();
      const sheetBtn = document.getElementById('sheetLinkBtn');
      if (sheetUrl) {
        sheetBtn.href = sheetUrl;
        sheetBtn.classList.remove('hidden');
      } else {
        sheetBtn.classList.add('hidden');
      }
      renderCategories();
      renderMenu();
    }

    function renderCategories() {
      const cats = ["全部", "蒸烤餐盒", "義大利麵", "單點配菜", "健康飲品"];
      document.getElementById('categoryTabs').innerHTML = cats.map(cat => `
        <button onclick="selectCategory('${cat}')" class="px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition ${
          currentCategory === cat ? 'bg-[#3d5a45] text-white shadow-sm' : 'bg-white text-stone-600 border border-stone-200 hover:bg-stone-100'
        }">${cat}</button>
      `).join('');
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategories();
      renderMenu();
    }

    function renderMenu() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = menuItems.filter(item => {
        const matchCat = currentCategory === "全部" || item.category === currentCategory;
        const matchKey = !keyword || item.name.toLowerCase().includes(keyword) || item.desc.toLowerCase().includes(keyword);
        return matchCat && matchKey;
      });

      document.getElementById('menuGrid').innerHTML = filtered.map(item => `
        <div class="bg-white rounded-xl p-4 shadow-sm border border-stone-200 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-start gap-2">
              <span class="text-[11px] px-2 py-0.5 rounded bg-emerald-50 text-[#3d5a45] font-medium">${item.category}</span>
              ${isEditMode ? `<button onclick="deleteMenuItem(${item.id})" class="text-xs text-red-500 hover:underline">刪除</button>` : ''}
            </div>
            ${isEditMode ? `
              <input type="text" value="${item.name}" onchange="updateMenuItem(${item.id}, 'name', this.value)" class="w-full border rounded px-2 py-1 text-sm font-bold mt-2" />
              <input type="number" value="${item.price}" onchange="updateMenuItem(${item.id}, 'price', Number(this.value))" class="w-24 border rounded px-2 py-1 text-sm font-bold mt-1 text-[#3d5a45]" />
            ` : `
              <h3 class="font-bold text-stone-900 text-base mt-2">${item.name}</h3>
              <p class="text-xs text-stone-500 mt-1 line-clamp-2">${item.desc}</p>
            `}
          </div>
          <div class="flex items-center justify-between mt-4 pt-3 border-t border-stone-100">
            <span class="font-bold text-[#3d5a45] text-base">NT$ ${item.price}</span>
            <button onclick="openCustomModal(${item.id})" class="bg-[#3d5a45] hover:bg-[#2f4635] text-white text-xs font-bold px-3.5 py-2 rounded-lg transition">
              + 選擇餐點
            </button>
          </div>
        </div>
      `).join('');
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      document.getElementById('adminAddSection').classList.toggle('hidden', !isEditMode);
      document.getElementById('editModeBtn').textContent = isEditMode ? '✅ 完成編輯' : '✏️ 菜單管理';
      renderMenu();
    }

    function updateMenuItem(id, field, val) {
      menuItems = menuItems.map(i => i.id === id ? { ...i, [field]: val } : i);
      localStorage.setItem('fly_kitchen_menu', JSON.stringify(menuItems));
    }

    function addNewMenuItem() {
      const name = document.getElementById('newItemName').value.trim();
      const category = document.getElementById('newItemCategory').value;
      const price = Number(document.getElementById('newItemPrice').value);
      if (!name || !price) return alert('請輸入餐點名稱與價格');
      menuItems.unshift({ id: Date.now(), name, category, price, desc: "自訂新增品項" });
      localStorage.setItem('fly_kitchen_menu', JSON.stringify(menuItems));
      document.getElementById('newItemName').value = '';
      document.getElementById('newItemPrice').value = '';
      renderMenu();
    }

    function deleteMenuItem(id) {
      if (!confirm('確定刪除此品項？')) return;
      menuItems = menuItems.filter(i => i.id !== id);
      localStorage.setItem('fly_kitchen_menu', JSON.stringify(menuItems));
      renderMenu();
    }

    function resetDefaultMenu() {
      if (!confirm('確定恢復預設菜單？')) return;
      menuItems = [...DEFAULT_MENU];
      localStorage.setItem('fly_kitchen_menu', JSON.stringify(menuItems));
      renderMenu();
    }

    function openCustomModal(id) {
      selectedItem = menuItems.find(i => i.id === id);
      document.getElementById('modalItemName').textContent = selectedItem.name;
      document.getElementById('modalItemPrice').textContent = `單價 NT$ ${selectedItem.price}`;
      document.getElementById('riceOptionGroup').classList.toggle('hidden', selectedItem.category !== '蒸烤餐盒');
      document.querySelectorAll('.addon-check').forEach(cb => cb.checked = false);
      document.getElementById('modalNote').value = '';
      document.getElementById('customModal').classList.remove('hidden');
    }

    function closeCustomModal() {
      document.getElementById('customModal').classList.add('hidden');
    }

    function confirmAddToCart() {
      const rice = selectedItem.category === '蒸烤餐盒' ? document.querySelector('input[name="rice"]:checked').value : '';
      const addons = [];
      let addonCost = 0;
      document.querySelectorAll('.addon-check:checked').forEach(cb => {
        addons.push(cb.dataset.name);
        addonCost += Number(cb.dataset.price);
      });
      const note = document.getElementById('modalNote').value.trim();
      const details = [rice, ...addons, note].filter(Boolean).join(' / ');

      cart.push({
        uid: Date.now(),
        name: selectedItem.name,
        unitPrice: selectedItem.price + addonCost,
        details
      });
      closeCustomModal();
      updateCartBar();
    }

    function updateCartBar() {
      const total = cart.reduce((sum, i) => sum + i.unitPrice, 0);
      document.getElementById('totalCount').textContent = cart.length;
      document.getElementById('totalPrice').textContent = total;
      document.getElementById('modalTotalPrice').textContent = total;
    }

    function openCartModal() {
      if (cart.length === 0) return alert('購物車目前是空的喔！');
      document.getElementById('submitStatusMsg').classList.add('hidden');
      renderCartItems();
      document.getElementById('cartModal').classList.remove('hidden');
    }

    function closeCartModal() {
      document.getElementById('cartModal').classList.add('hidden');
    }

    function renderCartItems() {
      document.getElementById('cartItemsList').innerHTML = cart.map((item, idx) => `
        <div class="flex justify-between items-center bg-stone-50 p-2.5 rounded-lg border border-stone-200 text-xs">
          <div>
            <div class="font-bold text-stone-900">${item.name}</div>
            ${item.details ? `<div class="text-stone-500 mt-0.5">${item.details}</div>` : ''}
          </div>
          <div class="flex items-center gap-3">
            <span class="font-bold text-[#3d5a45]">NT$ ${item.unitPrice}</span>
            <button onclick="removeCartItem(${idx})" class="text-red-500 hover:underline">移除</button>
          </div>
        </div>
      `).join('');
      updateCartBar();
    }

    function removeCartItem(idx) {
      cart.splice(idx, 1);
      if (cart.length === 0) return closeCartModal();
      renderCartItems();
    }

    function buildOrderSummaryText() {
      const name = document.getElementById('customerName').value.trim() || '未填寫姓名';
      const type = document.getElementById('orderType').value;
      const note = document.getElementById('globalOrderNote').value.trim();
      const total = cart.reduce((sum, i) => sum + i.unitPrice, 0);
      const lines = cart.map((i, idx) => `${idx + 1}. ${i.name}${i.details ? ` (${i.details})` : ''} - $${i.unitPrice}`);
      return `【非晉餐廚團購訂單】\n訂購人：${name} (${type})\n${lines.join('\n')}\n備註：${note || '無'}\n總計：NT$ ${total}`;
    }

    function copyOrderText() {
      navigator.clipboard.writeText(buildOrderSummaryText()).then(() => {
        alert('✅ 訂單明細已複製！可直接貼上至 LINE 群組。');
      });
    }

    async function submitOrderToSheet() {
      const customerName = document.getElementById('customerName').value.trim();
      if (!customerName) {
        alert('請先在上方輸入「訂購人姓名 / 部門」再送出喔！');
        closeCartModal();
        document.getElementById('customerName').focus();
        return;
      }

      const gasUrl = getGasUrl();
      if (!gasUrl) {
        alert('尚未設定 Google Apps Script 統計網址！請先點擊右上角「⚙️ 設定統計」貼上網址。');
        return;
      }

      const btn = document.getElementById('submitOrderBtn');
      const statusBox = document.getElementById('submitStatusMsg');
      btn.disabled = true;
      btn.textContent = '傳送中...';

      const payload = {
        customerName,
        orderType: document.getElementById('orderType').value,
        itemsSummary: cart.map(i => `${i.name}${i.details ? `(${i.details})` : ''}`).join('、'),
        note: document.getElementById('globalOrderNote').value.trim() || '無',
        totalPrice: cart.reduce((sum, i) => sum + i.unitPrice, 0),
        orderId: 'ORD-' + Math.floor(1000 + Math.random() * 9000)
      };

      try {
        await fetch(gasUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        statusBox.className = 'text-xs p-2.5 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-200';
        statusBox.textContent = `🎉 訂單已成功送出至統計表！(編號：${payload.orderId})`;
        statusBox.classList.remove('hidden');
        cart = [];
        updateCartBar();
      } catch (err) {
        statusBox.className = 'text-xs p-2.5 rounded-lg bg-red-50 text-red-700 border border-red-200';
        statusBox.textContent = '❌ 傳送失敗，請檢查網路或統計網址是否正確。';
        statusBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 送出並統計訂單';
      }
    }

    function openSettingsModal() {
      document.getElementById('gasUrlInput').value = getGasUrl();
      document.getElementById('sheetUrlInput').value = getSheetUrl();
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveSettings() {
      localStorage.setItem('fly_gas_url', document.getElementById('gasUrlInput').value.trim());
      localStorage.setItem('fly_sheet_url', document.getElementById('sheetUrlInput').value.trim());
      closeSettingsModal();
      init();
      alert('✅ 統計網址設定已儲存！');
    }

    init();
  </script>
